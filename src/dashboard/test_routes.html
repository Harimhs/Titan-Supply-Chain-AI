<!DOCTYPE html>
<html>
<head>
    <title>Route Test</title>
    <style>
        body { margin: 0; }
        #globeViz { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="globeViz"></div>
    <script src="//unpkg.com/globe.gl"></script>
    <script>
        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('#000');

        // Test with minimal routes
        const testRoutes = [
            { startLat: 28.6, startLng: 77.2, endLat: 40.7, endLng: -74.0 }, // Delhi to NYC
            { startLat: 51.5, startLng: -0.1, endLat: 35.7, endLng: 139.7 }, // London to Tokyo
            { startLat: -33.9, startLng: 18.4, endLat: -34.6, endLng: -58.4 } // Cape Town to Buenos Aires
        ];

        globe.arcsData(testRoutes)
            .arcColor(() => '#00fff2')
            .arcDashLength(0.4)
            .arcDashGap(0.2)
            .arcDashAnimateTime(2000)
            .arcStroke(1);

        console.log('Test routes loaded:', testRoutes.length);
    </script>
</body>
</html>
